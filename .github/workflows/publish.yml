name: Publish to npm

# Publishes via npm trusted publishing (OIDC): no npm token is stored in this
# repo. The trusted publisher on npmjs.com must name this repository and this
# workflow file (publish.yml). Provenance is attached automatically.
#
# Release flow: bump "version" in package.json on main, then publish a GitHub
# release tagged v<version>.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Images are committed build output (npm run build takes ~5 min and
      # needs the openmoji devDependency), so publish does not rebuild.
      - name: Check packed contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
