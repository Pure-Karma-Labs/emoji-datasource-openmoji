name: Publish to npm

# Stages a release via npm trusted publishing (OIDC): no npm token is stored
# in this repo. The trusted publisher on npmjs.com names this repository, this
# workflow file (publish.yml) and the `npm` environment, with stage-only
# permissions, so this workflow cannot publish directly.
#
# Release flow: bump "version" in package.json on main, publish a GitHub
# release tagged v<version>, then a maintainer approves the staged package
# with 2FA (npmjs.com -> Staged Packages, or `npm stage approve <stage-id>`).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          npm install -g npm@^11.15.0
          npm --version

      # Images are committed build output (npm run build takes ~5 min and
      # needs the openmoji devDependency), so publish does not rebuild.
      - name: Check packed contents
        run: npm pack --dry-run

      - name: Stage for maintainer approval
        run: npm stage publish
